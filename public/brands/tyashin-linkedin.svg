  <path d="M 118,124 A 95,95 0 0 1 282,124" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.28"/>

  <circle cx="200" cy="82" r="14" fill="#EF9F27" opacity="0.18" filter="url(#ty-glow)"/>
